<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PromoRTRGarage | Advertising & Marketing Agency</title>

  <meta name="description" content="PromoRTRGarage is an advertising and marketing agency providing promotional services for YouTube, Twitch, Kick, gaming, music, creators and brands.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #08080c;
      color: #ffffff;
      line-height: 1.6;
    }

    /* NAVIGATION */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 8, 12, 0.95);
      border-bottom: 1px solid #24242f;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1100px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    .logo span {
      color: #b9b9ff;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      list-style: none;
    }

    .nav-links a {
      color: #c7c7d5;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    /* HERO */

    header {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      background:
        radial-gradient(circle at top, #343451 0%, #171725 35%, #08080c 75%);
    }

    .hero {
      max-width: 850px;
    }

    .badge {
      display: inline-block;
      padding: 8px 17px;
      border: 1px solid #41415a;
      border-radius: 30px;
      color: #d5d5e7;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 56px;
      margin-bottom: 12px;
      letter-spacing: -1.5px;
    }

    .hero h1 span {
      color: #b9b9ff;
    }

    .hero h2 {
      font-size: 24px;
      margin-bottom: 18px;
      color: #dedeea;
      font-weight: normal;
    }

    .hero p {
      color: #aaaabd;
      max-width: 700px;
      margin: auto;
      font-size: 17px;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      margin: 6px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .primary {
      background: #ffffff;
      color: #111111;
    }

    .secondary {
      border: 1px solid #444458;
      color: #ffffff;
      background: #15151f;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* SECTIONS */

    section {
      max-width: 1100px;
      margin: auto;
      padding: 80px 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #9f9faf;
    }
